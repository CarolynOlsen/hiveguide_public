  integration-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, web-rn-build, mobile-typecheck, shared-typecheck]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "==================================="
          echo "CI Pipeline Results"
          echo "==================================="
          echo "✓ Backend Tests: ${{ needs.backend-tests.result }}"
          echo "✓ Web RN Build: ${{ needs.web-rn-build.result }}"
          echo "✓ Mobile TypeScript: ${{ needs.mobile-typecheck.result }}"
          echo "✓ Shared Types: ${{ needs.shared-typecheck.result }}"
          echo "==================================="
          
          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.web-rn-build.result }}" != "success" ] || \
             [ "${{ needs.mobile-typecheck.result }}" != "success" ] || \
             [ "${{ needs.shared-typecheck.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          
          echo "✅ All critical checks passed - Ready for merge!"
